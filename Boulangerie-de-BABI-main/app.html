<!DOCTYPE html><html><head>

    This is a placeholder for base href that will be replaced by the value of

  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Boulangerie de Babi - Application Officielle">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Boulangerie de Babi">
  <link rel="apple-touch-icon" href="/assets/logoApp.png?v=logoapp_final">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/logoApp.png?v=logoapp_final">
  <link rel="shortcut icon" type="image/png" href="/assets/logoApp.png?v=logoapp_final">
  <link rel="icon" type="image/x-icon" href="/assets/logoApp.png?v=logoapp_final">

  <script>
    (function() {
      function forceFavicon() {
        var links = document.querySelectorAll("link[rel*='icon']");
        links.forEach(function(el) { el.parentNode.removeChild(el); });
        var newLink = document.createElement('link');
        newLink.type = 'image/png';
        newLink.rel = 'icon';
        newLink.href = '/assets/logoApp.png?v=babi_logoapp_' + Math.floor(Date.now() / 60000);
        document.head.appendChild(newLink);
      }
      forceFavicon();
      window.addEventListener('DOMContentLoaded', forceFavicon);
      window.addEventListener('load', forceFavicon);
      setInterval(forceFavicon, 2000);
    })();

    // 🌐 BABI Mobile App Real-time Global Sync Bridge
    (function() {
      try {
        const globalSyncChan = new BroadcastChannel('babi_global_sync');
        globalSyncChan.onmessage = function(e) {
          if (!e.data) return;
          window.dispatchEvent(new CustomEvent('babi_mobile_sync', { detail: e.data }));
        };
        window.babiPostMobileSync = function(eventType, payload) {
          globalSyncChan.postMessage({ type: eventType, payload: payload, timestamp: Date.now() });
          try {
            localStorage.setItem('babi_last_sync_event', JSON.stringify({ type: eventType, payload: payload, timestamp: Date.now() }));
          } catch(e) {}
        };
      } catch (err) {}
    })();
  </script>

  <title>Boulangerie de Babi - Application Mobile Officielle</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;

      background-color: #FACC15;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>

      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
