name: babi_flutter_web
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  crypto: ^3.0.3
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logoApp.webp"

flutter_native_splash:
  color: "#FACC15"
  image: "assets/logoApp.webp"
  android: true
  ios: true
